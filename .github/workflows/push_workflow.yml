name: Deploy nodejs app to Cpanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -p 25552 -H 198.251.84.129 >> ~/.ssh/known_hosts

      - name: Deploy to Cpanel
        run: |
          # Wait a moment to ensure all files are written
          sleep 2
          
          # Create a tarball of essential files (built .next, config files, package files)
          # Using --warning=no-file-changed to ignore file changes during archive creation
          tar --warning=no-file-changed \
              --exclude='node_modules' \
              --exclude='.git' \
              --exclude='.next/cache' \
              --exclude='.github' \
              --exclude='dist' \
              --exclude='.env.local' \
              --exclude='.env*.local' \
              --exclude='*.log' \
              --exclude='.DS_Store' \
              -czf deploy.tar.gz .
          
          # Verify tarball was created
          if [ ! -f deploy.tar.gz ]; then
            echo "Error: Failed to create tarball"
            exit 1
          fi
          
          echo "Tarball created successfully: $(ls -lh deploy.tar.gz)"
          
          # Copy the tarball to the server
          echo "Copying tarball to server..."
          scp -P 25552 -o StrictHostKeyChecking=no deploy.tar.gz fiveditc@198.251.84.129:/tmp/ || { echo "Failed to copy tarball to server"; exit 1; }
          
          echo "Tarball copied successfully"
          
          # Extract and deploy on the server
          ssh -o StrictHostKeyChecking=no -p 25552 fiveditc@198.251.84.129 bash << 'EOF'
          set -e
          echo "Starting deployment..."
          cd /home/fiveditc/domains/fivedit.com/public_html || { echo "Failed to change directory"; exit 1; }
          
          # Pull latest code to get any new files
          echo "Pulling latest code..."
          git pull origin production || echo "Warning: git pull failed, continuing..."
          
          # Extract built files (this will overwrite with the built version)
          echo "Extracting deployment files..."
          tar -xzf /tmp/deploy.tar.gz || { echo "Failed to extract tarball"; exit 1; }
          
          # Remove tarball
          echo "Cleaning up tarball..."
          rm -f /tmp/deploy.tar.gz
          
          # Install/update dependencies
          echo "Installing dependencies..."
          npm install --production || { echo "Failed to install dependencies"; exit 1; }
          
          # Restart the application
          echo "Restarting application..."
          cloudlinux-selector restart --user fiveditc --interpreter nodejs --app-root /home/fiveditc/domains/fivedit.com/public_html --json || { echo "Failed to restart application"; exit 1; }
          
          echo "Deployment completed successfully!"
          EOF
          
          # Clean up local tarball
          rm deploy.tar.gz