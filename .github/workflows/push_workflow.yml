name: Deploy NodeJS App to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      - name: Build Admin app
        run: |
          echo "Building admin app..."
          cd admin
          npm install
          npm run build
          echo "✅ Admin build completed"
          ls -lh dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 25552 -H 198.251.84.129 >> ~/.ssh/known_hosts

      # Shared SSH options (cPanel/DirectAdmin: avoid long hangs; tune keepalives)
      # Uploads use SFTP subsystem first so the server does NOT run login shell / ~/.nvm/nvm.sh
      # (legacy scp -O can trigger nvm and hit "fork: Resource temporarily unavailable" under LVE)
      - name: Create deployment tarball
        run: |
          set -e

          echo "Preparing tar exclude list..."
          cat <<EOF > /tmp/tar-exclude.txt
          node_modules
          api/node_modules
          admin/node_modules
          admin/dist
          .git
          .github
          .next/cache
          .env.local
          .env*.local
          api/.env
          *.log
          .DS_Store
          deploy.tar.gz
          admin-deploy.tar.gz
          EOF

          echo "Creating tarball..."
          tar \
            --warning=no-file-changed \
            --ignore-failed-read \
            --exclude-from=/tmp/tar-exclude.txt \
            -czf deploy.tar.gz .

          TAR_EXIT=$?
          if [ $TAR_EXIT -gt 1 ]; then
            echo "Tar failed with exit code: $TAR_EXIT"
            exit 1
          fi

          ls -lh deploy.tar.gz
          echo "deploy.tar.gz bytes: $(stat -c%s deploy.tar.gz)"
          echo "deploy.tar.gz sha256: $(sha256sum deploy.tar.gz | awk '{print $1}')"

      - name: Create admin deployment tarball
        run: |
          echo "Creating admin tarball..."
          cd admin/dist
          tar -czf ../../admin-deploy.tar.gz .
          cd ../..
          ls -lh admin-deploy.tar.gz
          echo "admin-deploy.tar.gz bytes: $(stat -c%s admin-deploy.tar.gz)"
          echo "admin-deploy.tar.gz sha256: $(sha256sum admin-deploy.tar.gz | awk '{print $1}')"

      - name: Debug tarball sizes
        run: |
          echo "=== Local tarball debug ==="
          du -h deploy.tar.gz admin-deploy.tar.gz
          wc -c deploy.tar.gz admin-deploy.tar.gz
          ls -lah deploy.tar.gz admin-deploy.tar.gz

      - name: Upload tarballs to server
        run: |
          set -euo pipefail
          # scp uses -P for port; ssh uses -p. Keep only shared -o flags here.
          SSH_OPTS=(
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=accept-new
            -o TCPKeepAlive=yes
            -o BatchMode=yes
          )
          HOST="fiveditc@198.251.84.129"
          PORT=25552

          # 1) SFTP subsystem: no login shell → ~/.nvm/nvm.sh is not sourced (avoids fork/EAGAIN under CloudLinux LVE)
          # 2) scp without -O: SFTP back-end on OpenSSH 8+ client
          # 3) scp -O: legacy protocol for older hosts only
          upload_with_fallbacks() {
            local file="$1"
            local dest_name="$2"
            local attempt batch
            for attempt in 1 2 3; do
              echo "=== $dest_name — attempt $attempt/3 ==="

              batch="$(mktemp)"
              printf 'put -f %s /tmp/%s\nbye\n' "$file" "$dest_name" > "$batch"
              if sftp "${SSH_OPTS[@]}" -P "$PORT" -b "$batch" "$HOST"; then
                rm -f "$batch"
                echo "✅ Uploaded via SFTP: /tmp/${dest_name}"
                return 0
              fi
              rm -f "$batch"
              echo "⚠️ SFTP failed, trying scp (SFTP protocol)..."

              if scp "${SSH_OPTS[@]}" -P "$PORT" "$file" "$HOST:/tmp/$dest_name"; then
                echo "✅ Uploaded via scp (SFTP): /tmp/${dest_name}"
                return 0
              fi
              echo "⚠️ scp SFTP failed, trying legacy scp -O..."

              if scp -O "${SSH_OPTS[@]}" -P "$PORT" "$file" "$HOST:/tmp/$dest_name"; then
                echo "✅ Uploaded via legacy scp: /tmp/${dest_name}"
                return 0
              fi

              echo "⚠️ All methods failed this round; sleeping 10s..."
              sleep 10
            done

            echo "❌ Failed to upload ${file} after 3 rounds"
            echo "SSH debug probe (shell login may still source nvm):"
            ssh -vvv "${SSH_OPTS[@]}" -p "$PORT" "$HOST" \
              "echo probe; hostname; whoami; ulimit -u 2>/dev/null || true; df -h /tmp 2>/dev/null || true" || true
            return 1
          }

          echo "Uploading tarballs (SFTP-first avoids remote nvm fork storms on shared hosting)..."
          upload_with_fallbacks deploy.tar.gz deploy.tar.gz
          upload_with_fallbacks admin-deploy.tar.gz admin-deploy.tar.gz

      - name: Deploy on cPanel server
        run: |
          echo "Starting remote deployment..."
          # bash --noprofile --norc: skip ~/.bashrc nvm hooks (same fork/LVE issue as uploads)
          ssh \
            -T \
            -p 25552 \
            -o ConnectTimeout=30 \
            -o RequestTTY=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            fiveditc@198.251.84.129 \
            'bash --noprofile --norc -s' << 'EOF'
          set -e
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH:-}"
          # Use CloudLinux Node Selector venv for npm (avoid nvm in ~/.bashrc under LVE)
          NEXT_NODEVENV="/home/fiveditc/nodevenv/domains/fivedit.com/public_html/20/bin/activate"
          if [ -f "$NEXT_NODEVENV" ]; then
            source "$NEXT_NODEVENV"
          fi

          APP_DIR="/home/fiveditc/domains/fivedit.com/public_html"
          API_DIR="/home/fiveditc/domains/fivedit.com/api"

          echo "Moving to app directory..."
          cd $APP_DIR

          echo "Extracting upload..."
          tar -xzf /tmp/deploy.tar.gz --exclude='admin'

          echo "Cleaning tar file..."
          rm -f /tmp/deploy.tar.gz

          # Deploy Admin app
          echo "Deploying Admin app..."
          ADMIN_DIR="/home/fiveditc/domains/admin.fivedit.com/public_html"
          mkdir -p $ADMIN_DIR
          
          echo "Extracting admin files..."
          cd $ADMIN_DIR
          tar -xzf /tmp/admin-deploy.tar.gz
          rm -f /tmp/admin-deploy.tar.gz
          
          echo "✅ Admin app deployed to $ADMIN_DIR"

          # Deploy API
          echo "Deploying API..."
          if [ -d "$APP_DIR/api" ]; then
            echo "Setting up API directory..."
            mkdir -p $API_DIR
            
            # Backup existing .env if it exists
            if [ -f "$API_DIR/.env" ]; then
              cp $API_DIR/.env $API_DIR/.env.backup
              echo "✅ Backed up existing API .env file"
            fi
            
            echo "Copying API files..."
            # Copy all API files
            cp -r $APP_DIR/api/* $API_DIR/ 2>/dev/null || true
            
            # Restore .env backup if it existed
            if [ -f "$API_DIR/.env.backup" ]; then
              mv $API_DIR/.env.backup $API_DIR/.env
              echo "✅ Restored API .env file"
            elif [ ! -f "$API_DIR/.env" ]; then
              echo "⚠️ API .env file not found - configure database credentials in $API_DIR/.env"
            fi
            
            echo "Installing API dependencies..."
            cd $API_DIR
            source /home/fiveditc/nodevenv/domains/fivedit.com/api/20/bin/activate && cd /home/fiveditc/domains/fivedit.com/api
            npm install --production
            
            echo "Migrating API database..."
            npm run migrate
            
            echo "Seeding API database..."
            npm run seed
            
            echo "Restarting API..."
            cloudlinux-selector restart \
              --user fiveditc \
              --interpreter nodejs \
              --app-root $API_DIR \
              --json || echo "⚠️ API restart failed - ensure API is configured in CloudLinux"
          else
            echo "⚠️ API directory not found in deployment - skipping API deployment"
          fi

          # Deploy Next.js app
          echo "Installing Next.js production dependencies..."
          cd $APP_DIR
          npm install --production

          echo "Restarting Next.js app..."
          cloudlinux-selector restart \
            --user fiveditc \
            --interpreter nodejs \
            --app-root $APP_DIR \
            --json

          echo "✅ Deployment completed successfully"
          EOF

      - name: Cleanup
        run: |
          rm -f deploy.tar.gz admin-deploy.tar.gz
          echo "✅ Cleanup completed"
