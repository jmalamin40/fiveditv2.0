name: Deploy NodeJS App to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 25552 -H 198.251.84.129 >> ~/.ssh/known_hosts

      - name: Create deployment tarball
        run: |
          set -e

          echo "Preparing tar exclude list..."
          cat <<EOF > /tmp/tar-exclude.txt
          node_modules
          .git
          .github
          .next/cache
          .env.local
          .env*.local
          *.log
          .DS_Store
          deploy.tar.gz
          EOF

          echo "Creating tarball..."
          tar \
            --warning=no-file-changed \
            --ignore-failed-read \
            --exclude-from=/tmp/tar-exclude.txt \
            -czf deploy.tar.gz .

          TAR_EXIT=$?
          if [ $TAR_EXIT -gt 1 ]; then
            echo "Tar failed with exit code: $TAR_EXIT"
            exit 1
          fi

          ls -lh deploy.tar.gz

      - name: Upload tarball to server
        run: |
          echo "Uploading tarball..."
          scp -P 25552 deploy.tar.gz fiveditc@198.251.84.129:/tmp/

      - name: Deploy on cPanel server
        run: |
          echo "Starting remote deployment..."

          ssh -p 25552 fiveditc@198.251.84.129 << 'EOF'
          set -e

          APP_DIR="/home/fiveditc/domains/fivedit.com/public_html"

          echo "Moving to app directory..."
          cd $APP_DIR

          echo "Extracting upload..."
          tar -xzf /tmp/deploy.tar.gz

          echo "Cleaning tar file..."
          rm -f /tmp/deploy.tar.gz

          echo "Installing production dependencies..."
          npm install --production

          echo "Restarting Node app..."
          cloudlinux-selector restart \
            --user fiveditc \
            --interpreter nodejs \
            --app-root $APP_DIR \
            --json

          echo "✅ Deployment completed successfully"
          EOF
