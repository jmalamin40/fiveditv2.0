name: Deploy nodejs app to Cpanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -p 25552 -H 198.251.84.129 >> ~/.ssh/known_hosts

      - name: Deploy to Cpanel
        run: |
          ssh -o StrictHostKeyChecking=no -p 25552 fiveditc@198.251.84.129 bash << 'EOF'
          set -e
          # Activate Node.js environment and navigate to project directory
          source /home/fiveditc/nodevenv/domains/fivedit.com/public_html/20/bin/activate && cd /home/fiveditc/domains/fivedit.com/public_html
          # Pull latest code
          git pull origin production
          # Install dependencies
          npm install
          # Build Next.js project with limited parallelism to avoid thread pool issues
          export NODE_OPTIONS="--max-old-space-size=2048"
          export NEXT_TELEMETRY_DISABLED=1
          export RAYON_NUM_THREADS=1
          npm run build
          # Restart the application
          cloudlinux-selector restart --user fiveditc --interpreter nodejs --app-root /home/fiveditc/domains/fivedit.com/public_html --json
          EOF