name: Deploy Node.js App to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js project
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -p 25552 -H 198.251.84.129 >> ~/.ssh/known_hosts

      - name: Deploy using rsync
        run: |
          echo "Starting deployment via rsync..."

          rsync -avz --delete \
            --exclude "node_modules" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".next/cache" \
            --exclude ".env.local" \
            --exclude ".env*.local" \
            --exclude "*.log" \
            --exclude ".DS_Store" \
            --exclude "deploy.tar.gz" \
            -e "ssh -p 25552 -o StrictHostKeyChecking=no" \
            ./ fiveditc@198.251.84.129:/home/fiveditc/domains/fivedit.com/public_html/

      - name: Restart Node App on cPanel
        run: |
          echo "Restarting Node.js app on server..."

          ssh -p 25552 -o StrictHostKeyChecking=no fiveditc@198.251.84.129 << EOF
          set -e

          cd /home/fiveditc/domains/fivedit.com/public_html

          echo "Installing production dependencies..."
          npm install --production

          echo "Restarting Node app using CloudLinux selector..."
          cloudlinux-selector restart \
            --user fiveditc \
            --interpreter nodejs \
            --app-root /home/fiveditc/domains/fivedit.com/public_html \
            --json

          echo "✅ Deployment finished successfully"
          EOF
